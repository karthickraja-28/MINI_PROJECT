<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<!-- Font Awesome -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="style.css">


</head>
<body class="register-body">


<!-- Header -->
<header>

    <div class="logo">
        <h3>Library</h3>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

</header>


<!-- Page Heading -->
<h1 class="fw-bold">Register Page</h1>


<!-- Register Form -->
<div class="container border rounded p-4 mt-4 register-container">

    <form onsubmit="registerUser(event)">

        <!-- User Name -->
        <div class="mb-3">

            <label
                for="userName"
                class="form-label">
                User Name
            </label>

            <input
                type="text"
                class="form-control"
                id="userName"
                placeholder="Enter your name"
                required>

        </div>


        <!-- Email -->
        <div class="mb-3">

            <label
                for="userEmail"
                class="form-label">
                User Email
            </label>

            <input
                type="email"
                class="form-control"
                id="userEmail"
                placeholder="Enter your email"
                required>

        </div>


        <!-- Phone Number -->
        <div class="mb-3">

            <label
                for="userPhone"
                class="form-label">
                User Phone Number
            </label>

            <input
                type="tel"
                class="form-control"
                id="userPhone"
                placeholder="Enter your phone number"
                required>

        </div>


        <!-- Address -->
        <div class="mb-3">

            <label
                for="userAddress"
                class="form-label">
                User Address
            </label>

            <textarea
                class="form-control"
                id="userAddress"
                rows="3"
                placeholder="Enter your address"
                required></textarea>

        </div>


        <!-- Password -->
        <div class="mb-3">

            <label
                for="userPassword"
                class="form-label">
                User Password
            </label>

            <input
                type="password"
                class="form-control"
                id="userPassword"
                placeholder="Enter your password"
                required>

        </div>


        <!-- Confirm Password -->
        <div class="mb-3">

            <label
                for="confirmPassword"
                class="form-label">
                Confirm Password
            </label>

            <input
                type="password"
                class="form-control"
                id="confirmPassword"
                placeholder="Confirm your password"
                required>

        </div>


        <!-- Submit Button -->
        <button
            type="submit"
            class="btn btn-primary">
            Register
        </button>

    </form>

</div>



<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Custom JavaScript -->
<script src="script.js"></script>

</body>
</html>
